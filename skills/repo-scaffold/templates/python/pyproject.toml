[project]
name = "@NAME@"
version = "0.0.0"
description = "@DESCRIPTION@"
readme = "README.md"
license = "@LICENSE@"
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/@OWNER@/@NAME@"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/@MODULE@"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT", "PL", "TRY"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
venvPath = ".devenv/state"
venv = "venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=@MODULE@ --cov-report=term-missing --cov-fail-under=90"
